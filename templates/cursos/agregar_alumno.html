<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{url_for('static',filename='dist/output.css')}}"
    />
  </head>
  <body>
    <div class="max-w-2xl mx-auto mt-6">
      <div
        class="bg-neutral-primary-soft shadow-xs rounded-base border border-default p-6"
      >
        <h2 class="text-xl font-semibold text-heading mb-2">
          Agregar alumno al curso
        </h2>
        <p class="text-body-secondary mb-6">
          Curso: <span class="font-medium">{{ curso.nombre }}</span>
        </p>
        <p class="text-body-secondary mb-6">
          Maestro:
          <span class="font-medium"
            >{{ curso.maestro.nombre }} {{ curso.maestro.apellidos }}</span
          >
        </p>

        {% if alumnos %}
        <form method="POST" class="space-y-4">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          <div>
            <label class="block text-sm font-medium text-heading mb-2"
              >Seleccionar alumno</label
            >
            <select
              name="alumno_id"
              required
              class="bg-neutral-secondary-soft border border-default-medium text-heading text-sm rounded-lg focus:ring-brand focus:border-brand block w-full p-2.5"
            >
              <option value="">Selecciona un alumno...</option>
              {% for alumno in alumnos %}
              <option value="{{ alumno.id }}">
                {{ alumno.nombre }} {{ alumno.apellidos }} - {{ alumno.email }}
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="flex justify-center space-x-4 pt-4">
            <button
              type="submit"
              class="text-white bg-green-600 hover:bg-green-700 focus:ring-4 focus:ring-green-300 font-medium rounded-lg text-sm px-5 py-2 text-center"
            >
              Agregar al curso
            </button>
            <a
              href="{{ url_for('cursos.ver_alumnos_curso', id=curso.id) }}"
              class="text-white bg-gray-600 hover:bg-gray-700 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2 text-center"
            >
              Cancelar
            </a>
          </div>
        </form>
        {% else %}
        <div class="text-center py-8">
          <p class="text-body-secondary mb-4">
            No hay alumnos disponibles para agregar
          </p>
          <p class="text-sm text-body-secondary mb-4">
            Todos los alumnos ya están inscritos en este curso
          </p>
          <a
            href="{{ url_for('cursos.ver_alumnos_curso', id=curso.id) }}"
            class="text-white bg-gray-600 hover:bg-gray-700 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2 text-center inline-block"
          >
            Regresar
          </a>
        </div>
        {% endif %}
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
  </body>
</html>
