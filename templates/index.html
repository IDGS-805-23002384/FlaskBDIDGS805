<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowbite Flask</title>
    <link
      rel="stylesheet"
      href="{{url_for('static',filename='dist/output.css')}}"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(to bottom, #dbeafe, #bfdbfe);
      }

      .container-principal {
        text-align: center;
        margin-top: 120px;
      }

      .container-principal h1 {
        font-size: 42px;
        color: #1e3a8a;
        margin-bottom: 10px;
      }

      .container-principal p {
        font-size: 18px;
        color: #374151;
      }
    </style>
  </head>

  <body>
    <nav
      class="bg-white border-gray-200 px-2 sm:px-4 py-2.5 rounded-sm dark:bg-gray-900"
    >
      <div
        class="container flex flex-wrap items-center justify-between mx-auto"
      >
        <a href="#" class="flex items-center">
          <img
            src="{{url_for('static',filename='img/ultlogo.png')}}"
            class="rounded-2xl h-6 mr-3 sm:h-9"
            alt="Flowbite Logo"
          />
          <span
            class="self-center text-xl font-semibold whitespace-nowrap dark:text-white"
            >Flask IDGS</span
          >
        </a>
        <div class="flex md:order-2"></div>
        <div
          class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1"
          id="navbar-cta"
        >
          <ul
            class="flex flex-col p-4 mt-4 border border-gray-100 rounded-lg bg-gray-50 md:flex-row md:space-x-8 md:mt-0 md:text-sm md:font-medium md:border-0 md:bg-white dark:bg-gray-800 md:dark:bg-gray-900 dark:border-gray-700"
          >
            <li>
              <a
                href="{{ url_for('alumnos.alumnos_a') }}"
                class="block py-2 pl-3 pr-4 text-white bg-blue-700 rounded-sm md:bg-transparent md:text-blue-700 md:p-0 dark:text-white"
                aria-current="page"
                >Alumnos</a
              >
            </li>
            <li>
              <a
                href="{{ url_for('maestros.lista_maestros') }}"
                class="block py-2 pl-3 pr-4 text-gray-700 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 md:p-0 md:dark:hover:text-white dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent dark:border-gray-700"
                >Maestros</a
              >
            </li>
            <li>
              <a
                href="{{ url_for('cursos.lista_cursos') }}"
                class="block py-2 pl-3 pr-4 text-gray-700 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 md:p-0 md:dark:hover:text-white dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent dark:border-gray-700"
                >Cursos</a
              >
            </li>
            <li></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container-principal">
      <h1>¡Bienvenido!</h1>
      <p>Sistema de Gestión Escolar</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
  </body>
</html>
